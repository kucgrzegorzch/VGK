name: VGK 0.1 Build ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj źródła VGK
        run: |
          unzip -o VGK-0.1-source-and-kernel.zip

      - name: Zainstaluj narzędzia
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make python3 grub-pc-bin grub-common xorriso mtools

      - name: Zbuduj jądro
        working-directory: VGK-0.1
        run: make clean all

      - name: Sprawdź jądro
        working-directory: VGK-0.1
        run: make test

      - name: Utwórz ISO
        working-directory: VGK-0.1
        run: make iso

      - name: Opublikuj ISO
        uses: actions/upload-artifact@v4
        with:
          name: VGK-0.1-ISO
          path: VGK-0.1/build/VGK-0.1.iso
          if-no-files-found: error

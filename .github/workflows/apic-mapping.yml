name: VGK APIC MMIO integration tests

on:
  pull_request:
    paths:
      - ".github/workflows/apic-mapping.yml"
      - "Makefile"
      - "include/vgk_apic_mapping.h"
      - "include/vgk_acpi.h"
      - "include/vgk_cpu_features.h"
      - "include/vgk_paging.h"
      - "include/vgk_paging_preflight.h"
      - "include/vgk_paging_ranges.h"
      - "include/vgk_paging_requirements.h"
      - "src/apic_mapping.c"
      - "src/acpi.c"
      - "src/kernel_native.c"
      - "src/paging.c"
      - "src/paging_preflight.c"
      - "src/paging_ranges.c"
      - "src/paging_requirements.c"
      - "tests/test_acpi_madt.c"
      - "tests/test_apic_mapping.c"
      - "tests/test_paging_preflight.c"
      - "tests/test_paging_ranges.c"
  push:
    branches:
      - test/apic-mmio-integration
      - test/apic-mmio-preflight
      - test/kernel-apic-mmio-preparation
    paths:
      - ".github/workflows/apic-mapping.yml"
      - "Makefile"
      - "include/vgk_apic_mapping.h"
      - "include/vgk_acpi.h"
      - "include/vgk_cpu_features.h"
      - "include/vgk_paging.h"
      - "include/vgk_paging_preflight.h"
      - "include/vgk_paging_ranges.h"
      - "include/vgk_paging_requirements.h"
      - "src/apic_mapping.c"
      - "src/acpi.c"
      - "src/kernel_native.c"
      - "src/paging.c"
      - "src/paging_preflight.c"
      - "src/paging_ranges.c"
      - "src/paging_requirements.c"
      - "tests/test_apic_mapping.c"
      - "tests/test_paging_preflight.c"
      - "tests/test_paging_ranges.c"
  workflow_dispatch:

jobs:
  apic-mmio-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang make

      - name: Compile native and UEFI integration module and run ACPI/APIC and paging preflight tests
        run: make clean acpi-test paging-ranges-test
